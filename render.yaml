# Render Blueprint untuk backend LinkSentinel.
# Pakai dengan: Render Dashboard > New > Blueprint, arahkan ke repo ini.
# Database TIDAK didefinisikan di sini karena kita pakai Neon (gratis & tahan lama).
services:
  - type: web
    name: linksentinel-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # isi manual dengan connection string Neon
      - key: FRONTEND_ORIGIN
        sync: false # isi dengan URL Vercel, mis. https://linksentinel.vercel.app
